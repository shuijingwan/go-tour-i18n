forbidden:
  - Golang
  - Go ihrisko
  - gorutína
  - gorutina
  - Go rutina
# Do not ban legitimate words such as korutina, potrubie or pole globally:
# their meaning depends on context and differs from goroutine/channel/slice.
keep:
  - Go
  - Go Playground
  - goroutine
  - gofmt
  - GOPATH
  - URL
  - ASCII
  - CPU
  - UTC
  - GitHub
  - Yongye
  - nil
