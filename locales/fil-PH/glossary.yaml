# Only stable mistakes are forbidden; ordinary Filipino words remain available
# when they are appropriate outside these technical/name contexts.
forbidden:
  - "go routine"
  - "Go routine"
  - "go-routine"
  - "Palaruan ng Go"

# Keep is reserved for canonical names or identifiers that can appear in
# otherwise translatable prose, not an inventory of protected Go code tokens.
keep:
  - "Go"
  - "A Tour of Go"
  - "Go Playground"
  - "goroutine"
  - "TranslationUnit"
  - "present.Section"
  - "Yongye"
  - "GitHub"
  - "URL"
  - "CPU"
  - "UTC"
  - "CDN"
