# ફક્ત સ્થિર, ચોક્કસ ખોટી રીતે લખાતા સત્તાવાર નામ/વિશિષ્ટ Go શબ્દો.
# સામાન્ય ગુજરાતી શબ્દો (જેમ કે "પાઇપ") અહીં વૈશ્વિક રીતે પ્રતિબંધિત નથી.
forbidden:
  - ગોરુટીન
  - ગો રૂટીન
  - Go પ્લેગ્રાઉન્ડ
  - Go Play Ground

# આ નામો/સંક્ષેપો વાંચી શકાય તેવા લખાણમાં પણ મૂળ લિપિમાં જ રાખવા.
# nil એ Go નું ચોક્કસ મૂલ્ય છે; તેને સામાન્ય "શૂન્ય" તરીકે ન લખવું.
# Go keyword/builtin/API/identifier ની સંપૂર્ણ યાદી અહીં પુનરાવર્તિત નથી.
