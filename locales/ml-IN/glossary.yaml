# ml-IN terminology authority for the Malayalam localization.
# Public identity (reference only; production/identity.json is authoritative):
# മലയാളം / Malayalam; locale and html_lang: ml-IN;
# canonical public URL: https://ml-go-dev.shuijingwanwq.com/
# In prose, inflect Malayalam naturally around retained ASCII names.
# Go code, keywords, identifiers, directives, paths, and link targets retain their
# original identity through the protector; the list below is not a code dictionary.
# The visible title is localized; the product name Go Playground is not.
# In teaching prose, distinguish concurrency from parallelism, basic types from
# underlying types, type assertions from conversions, and a nil interface from
# an interface containing a nil concrete value.
