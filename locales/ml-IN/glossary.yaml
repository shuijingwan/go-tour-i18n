# Only stable misrenderings of genuine names are globally forbidden.
# Do not forbid ordinary words that could be correct in another context.
forbidden:
  - "ഗോറൂട്ടീൻ"
  - "ഗോ റൂട്ടീൻ"
  - "ഗോ പ്ലേഗ്രൗണ്ട്"
  - "Go കളിസ്ഥലം"

# Retain these identities only where they occur in translatable prose.
# Go keywords, builtins, import paths, API identifiers and code are primarily
# protected structurally, not by enumerating them here.
keep:
  - "Go"
  - "Go Playground"
  - "goroutine"
  - "nil"
  - "GOPATH"
  - "URL"
  - "ASCII"
  - "CPU"
  - "UTC"
  - "Unicode"
  - "GitHub"
  - "Stringer"
