locale: el-GR

# Core source meanings follow the current 103 English Tour Pages, 19 eligible
# Example files, and English UI catalog. Greek prose inflects surrounding words
# naturally; Go identifiers, syntax, link targets, and directives remain unchanged.
# These are this locale's decisions, not claims of exclusive community usage.
#
# Distinctions: array != slice; basic != underlying type; interface value
# containing nil != a nil interface; channel != processing pipeline; Go's
# type assertion may panic, whereas its two-result form can test a type.
# "A Tour of Go" and "Go Playground" remain canonical named products.
mandatory:
  Go programming language: γλώσσα προγραμματισμού Go
  package: πακέτο
  function: συνάρτηση
  method: μέθοδος
  variable: μεταβλητή
  type: τύπος
  basic type: βασικός τύπος
  underlying type: υποκείμενος τύπος
  concrete type: συγκεκριμένος τύπος
  interface type: τύπος διεπαφής
  interface value: τιμή διεπαφής
  underlying concrete value: υποκείμενη τιμή συγκεκριμένου τύπου
  pointer: δείκτης
  pointer receiver: δέκτης δείκτη
  value receiver: δέκτης τιμής
  receiver: δέκτης
  interface: διεπαφή
  type assertion: ισχυρισμός τύπου
  type switch: διακλάδωση βάσει τύπου
  type parameter: παράμετρος τύπου
  constraint: περιορισμός
  type inference: συναγωγή τύπου
  type conversion: μετατροπή τύπου
  zero value: μηδενική τιμή
  array: πίνακας
  slice: τμήμα πίνακα
  map: πίνακας αντιστοίχισης
