# Only established misleading terms or misspelled brand/name variants are
# forbidden. Ordinary Greek words remain valid in unrelated contexts.
forbidden:
  - γκορουτίνα
  - γκο ρουτίνα
  - Go ρουτίνα
  - παιδική χαρά της Go
  - Παιδική Χαρά της Go
  - γλώσσα προγραμματισμού Golang
  - μηδενικός τύπος διεπαφής

# Canonical names in otherwise translatable prose. Do not mirror the Go keyword,
# builtin, identifier, package, or path inventory already protected structurally.
keep:
  - Go
  - A Tour of Go
  - Go Playground
  - goroutine
  - gofmt
  - GOPATH
  - GitHub
  - Yongye
  - TranslationUnit
  - present.Section
  - Stringer
  - URL
  - API
  - USDC
  - USDT
  - Base
  - Tron
  - TRC20
