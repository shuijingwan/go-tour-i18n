# Context-sensitive choices are guidance, not word-for-word replacement rules.
# The lexical meaning of "map" here is an associative data structure, never a
# geographical map. A slice is a flexible view into an underlying array; prose
# can use "τμήμα πίνακα" and explicitly explain its variable length/capacity.
# Code uses literal map, chan, struct, select, etc., as protected Go tokens.
