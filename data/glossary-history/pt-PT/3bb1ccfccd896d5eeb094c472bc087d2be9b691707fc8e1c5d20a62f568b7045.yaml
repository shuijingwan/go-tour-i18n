# Formas incompatíveis com a variante pt-PT ou com decisões nominais deste
# projeto. A lista evita apenas erros estáveis, sem proibir palavras que possam
# ser corretas noutros contextos.
forbidden:
  - Um Tour por Go
  - Tour de Go
  - Parque infantil do Go
  - Área de recreio do Go
  - usuário
  - usuários
  - aplicativo
  - aplicativos
  - tela
  - telas
  - rodar
  - rodando
  - resetar
  - ressetar
  - assertação
  - assertações

# Identidades técnicas e nomes próprios que permanecem exatamente como estão
# quando surgem em linguagem natural. Não duplica keywords, builtins, APIs,
# caminhos ou identificadores já protegidos estruturalmente.
keep:
  - Go
  - Go Playground
  - go.dev
  - gofmt
  - GOPATH
  - goroutine
  - goroutines
  - Goroutines
  - nil
  - panic
  - PageUp
  - PageDown
  - Shift
  - Enter
  - Ctrl
  - URL
  - URLs
  - API
  - APIs
  - ASCII
  - CPU
  - UTC
  - GitHub
  - GitHub Issues
  - TranslationUnit
  - present.Section
  - release.json
  - SHA256SUMS
  - CDN
