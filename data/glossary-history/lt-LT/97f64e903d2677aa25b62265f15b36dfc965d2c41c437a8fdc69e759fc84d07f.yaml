forbidden:
  - Golang
  - Go žaidimų aikštelė
  - Go žaidimų aikštė
  - gorutina
  - gorutinas
# These are natural-language identities/standard technical names whose spelling
# must remain stable. The list deliberately excludes the broad set of protected
# Go keywords, built-ins, package paths and API identifiers.
keep:
  - Go
  - Go Playground
  - goroutine
  - gofmt
  - GOPATH
  - URL
  - ASCII
  - CPU
  - UTC
  - GitHub
  - Yongye
