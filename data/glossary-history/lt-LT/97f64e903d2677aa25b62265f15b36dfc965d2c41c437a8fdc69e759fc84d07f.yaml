locale: lt-LT
# Lithuanian entries below are terminology decisions and citation forms, not
# blind string replacements. Inflect Lithuanian nouns and adjectives naturally
# in sentences while preserving the same technical concept.
# Protected Go keywords, built-ins, API names, paths and identifiers remain
# code identities; they are intentionally not duplicated wholesale in keep.
