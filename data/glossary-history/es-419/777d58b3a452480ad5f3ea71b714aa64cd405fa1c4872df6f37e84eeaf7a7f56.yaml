locale: es-419

# Convenciones propias de es-419: español técnico natural, comprensible en toda
# Latinoamérica; trato de tú solo cuando el original se dirige al estudiante.
# Las correspondencias de abajo rigen el lenguaje explicativo, no el código.
# En el recorrido, slide se expresa como página; las slides de una charla son
# diapositivas. Las palabras inglesas que son identificadores de Go no se traducen.
