# Solo errores inequívocos en este proyecto; no prohibir sinónimos regionales
# legítimos ni «diapositivas», que sí describe las presentaciones enlazadas.
forbidden:
  - gorutina
  - gorutinas
  - patio de juegos de Go
  - Patio de juegos de Go
  - retorno desnudo

# Identidades visibles en texto natural; el resto de identificadores, rutas,
# palabras clave y código están protegidos por el protector estructural.
keep:
  - Go
  - Go Playground
  - goroutine
  - goroutines
  - Goroutines
  - gofmt
  - GOPATH
  - URL
  - API
  - ASCII
  - UTC
  - TranslationUnit
  - present.Section
  - GitHub
  - Yongye
