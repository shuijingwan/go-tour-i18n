forbidden:
  - Golang
  - Go-leikkikenttä
  - go-rutiini
  - gorutiini
# A coroutine is not the same concept as Go's goroutine; do not globally ban
# the Finnish word korutiini when the English source actually means coroutine.
keep:
  - Go
  - Go Playground
  - goroutine
  - gofmt
  - GOPATH
  - URL
  - ASCII
  - CPU
  - UTC
  - GitHub
  - Yongye
  - nil
