locale: fi-FI
# Finnish entries are citation forms, not literal replacements. Inflect nouns,
# adjectives and compounds according to their roles in each Finnish sentence.
# Preserve the technical identity of Go, Go Playground and goroutine when
# adding Finnish case endings; never translate protected code or identifiers.
