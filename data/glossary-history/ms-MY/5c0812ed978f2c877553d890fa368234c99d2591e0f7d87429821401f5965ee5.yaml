# Bentuk salah yang jelas bagi kandungan A Tour of Go ini sahaja.
# Jangan larang varian bahasa Melayu yang sah dalam konteks lain.
forbidden:
  - gorutin
  - Taman Permainan Go

# Identiti jenama/teknikal yang benar-benar muncul dalam teks semula jadi.
# Sintaks, nama pakej dan identifier dalam kod sudah diurus oleh protector.
keep:
  - A Tour of Go
  - Go Playground
  - Go
  - goroutine
  - nil
  - panic
  - gofmt
  - GOPATH
  - URL
  - CPU
  - UTC
  - GitHub
  - Stringer
